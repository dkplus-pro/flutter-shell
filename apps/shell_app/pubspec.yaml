name: fluttershell
description: "Flutter shell app: composable host for pages, routing and native bridge demo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  app_core:
    path: ../../packages/app_core
  app_ui:
    path: ../../packages/app_ui
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  native_bridge:
    path: ../../packages/native_bridge
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: 4.0.9

flutter:
  generate: true
  uses-material-design: true
